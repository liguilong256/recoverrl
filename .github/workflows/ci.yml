name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,data]"
      - run: python -m ruff check src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m recoverrl evaluate --tasks 4 --output runs/ci
      - run: python -m recoverrl.training.launch --dry-run --steps 1 --output runs/ci-launch
      - run: python scripts/report_baselines.py --output runs/baseline_smoke.json
      - run: python -c "from pathlib import Path; assert Path('runs/baseline_smoke.json').read_bytes() == Path('reports/baseline_smoke.json').read_bytes()"
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-checks-${{ matrix.os }}-${{ matrix.python }}
          path: runs/

  verl-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: verl-project/verl
          ref: 3e0d79ea8c38264bcaddc64de1b3465589580320
          path: .deps/verl
      - run: python -m pip install -e . hydra-core==1.3.2
      - run: python scripts/check_verl_config.py --verl .deps/verl
